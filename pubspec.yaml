name: health_insurance_app
description: Complete Health Insurance Mobile App with CareConnect Services - Bupa Arabia Style
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Localization
  intl: ^0.18.1
  flutter_localizations:
    sdk: flutter

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Authentication
  local_auth: ^2.1.7
  pin_code_fields: ^8.0.1

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  table_calendar: ^3.0.9
  qr_flutter: ^4.1.0

  # File Handling
  image_picker: ^1.0.5
  file_picker: ^6.1.1

  # Utils
  uuid: ^4.2.2
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Removed generate: true as we're using custom AppLocalizations
  # Comment out empty assets for now
  # assets:
  #   - assets/images/
  #   - assets/icons/
