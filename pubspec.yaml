name: insurance_app
description: A simple insurance mobile app with login, policies, claims, and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management and utilities
  provider: ^6.1.1

  # Local storage for auth token
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.0.0

  # UI components
  flutter_svg: ^2.0.9

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Add assets if needed later
  # assets:
  #   - assets/images/
  #   - assets/icons/
