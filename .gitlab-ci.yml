# GitLab CI/CD Configuration for Flutter App
# This file defines how GitLab will build and test the app

# Use a Docker image with Flutter pre-installed
image: cirrusci/flutter:stable

# Stages of the CI/CD pipeline
stages:
  - test
  - build
  - deploy

# Before running any job, get all dependencies
before_script:
  - flutter --version
  - flutter doctor -v
  - flutter pub get

# Cache Flutter packages to speed up builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pub-cache/
    - .dart_tool/

# ==========================================
# STAGE 1: TEST & ANALYSIS
# ==========================================

analyze_and_test:
  stage: test
  script:
    # Analyze code for any issues
    - echo "Running Flutter analyze..."
    - flutter analyze || true

    # Run tests (if we had any test files)
    - echo "Running Flutter tests..."
    - flutter test || echo "No tests found, skipping..."

  # Allow failure for now (since we don't have tests yet)
  allow_failure: true

  # Only run on main branch and merge requests
  only:
    - main
    - merge_requests
    - tags

# ==========================================
# STAGE 2: BUILD MOBILE APPS
# ==========================================

build_android_apk:
  stage: build
  script:
    # Build the Android APK in release mode
    - echo "Building Android APK..."
    - flutter build apk --release --verbose

    # Show build info
    - echo "✅ APK built successfully!"
    - echo "📱 Location: build/app/outputs/flutter-apk/app-release.apk"
    - ls -lh build/app/outputs/flutter-apk/
    - echo "📦 APK Size:" && du -h build/app/outputs/flutter-apk/app-release.apk

  # Save the built APK as an artifact (downloadable file)
  artifacts:
    name: "insurance-app-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 30 days
    reports:
      dotenv: build.env

  # Only build on main branch and merge requests
  only:
    - main
    - merge_requests
    - tags

build_android_bundle:
  stage: build
  script:
    # Build the Android App Bundle (for Google Play Store)
    - echo "Building Android App Bundle..."
    - flutter build appbundle --release --verbose

    # Show build info
    - echo "✅ App Bundle built successfully!"
    - echo "📱 Location: build/app/outputs/bundle/release/app-release.aab"
    - ls -lh build/app/outputs/bundle/release/
    - echo "📦 Bundle Size:" && du -h build/app/outputs/bundle/release/app-release.aab

  # Save the built bundle as an artifact
  artifacts:
    name: "insurance-app-bundle-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/app/outputs/bundle/release/app-release.aab
    expire_in: 30 days

  # Only build on main branch and tags
  only:
    - main
    - tags

build_web:
  stage: build
  script:
    # Build Flutter web app
    - echo "Building Flutter Web..."
    - flutter build web --release --verbose

    # Show build info
    - echo "✅ Web app built successfully!"
    - echo "🌐 Location: build/web/"
    - ls -lh build/web/
    - echo "📦 Build Size:" && du -sh build/web/

  # Save web build as artifact
  artifacts:
    name: "insurance-app-web-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/web/
    expire_in: 30 days

  # Only build on main branch
  only:
    - main
    - tags

